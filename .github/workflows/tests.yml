name: Tests

on:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show git version
        run: git --version
      - name: Configure git identity
        run: |
          git config --global user.name 'John Doe'
          git config --global user.email 'email@example.com'
      - name: Run tests
        run: ./test/run-tests
